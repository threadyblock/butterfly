<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Butterfly Catcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;700&display=swap');

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            color: #4a4a4a;
            overflow: hidden;
            touch-action: none;
        }

        .magic-font {
            font-family: 'Pacifico', cursive;
        }

        /* Mirroring is done when drawing, so game coordinates match the screen */
        #output_canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            filter: contrast(1.1) brightness(1.1) saturate(1.2); /* Dreamy filter */
        }

        /* UI overlay sits on top */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .sparkle-anim {
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <video id="input_video" style="display: none;"></video>
    <canvas id="output_canvas"></canvas>

    <div id="ui-layer" class="p-6">
        
        <!-- Top Bar -->
        <div class="flex justify-between items-start w-full">
            <div class="glass-panel p-4 rounded-3xl ml-36"> <!-- Margin for Stop Flower -->
                <h1 class="text-3xl magic-font text-purple-600 drop-shadow-sm">Butterfly Catcher</h1>
                <div class="text-purple-800 text-sm font-bold">Magical Mirror Mode</div>
            </div>

            <div class="glass-panel p-4 rounded-3xl text-right min-w-[120px]">
                <div class="text-xs text-purple-800 uppercase tracking-widest font-bold">Butterflies</div>
                <div id="score-display" class="text-4xl font-bold text-pink-600 magic-font">0</div>
            </div>
        </div>

        <!-- Center Message Area -->
        <div id="combo-display" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-center transition-opacity duration-200 opacity-0 pointer-events-none">
            <h2 id="combo-text" class="text-6xl magic-font text-white drop-shadow-[0_0_10px_rgba(236,72,153,0.8)]">Magical!</h2>
        </div>

        <!-- Start Screen -->
        <div id="menu-overlay" class="absolute inset-0 bg-white/60 flex flex-col items-center justify-center z-50 pointer-events-auto backdrop-blur-md">
            <div class="text-center max-w-lg p-8 bg-white/80 rounded-3xl shadow-2xl border-4 border-pink-200">
                <h1 class="text-6xl magic-font text-pink-500 mb-4">Enchanted Forest</h1>
                <p class="text-xl text-gray-600 mb-8 font-bold">
                    Stand back and use your hands to catch the butterflies.<br>
                    <span class="text-pink-500">Pink = Left Hand</span> <br>
                    <span class="text-teal-500">Teal = Right Hand</span> <br>
                    <span class="text-base">Hold a finger on the flower to stop.</span>
                </p>

                <p id="error-msg" class="hidden mb-4 text-red-500 font-bold"></p>
                
                <div id="loading-spinner" class="hidden mb-4">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-pink-400 mx-auto"></div>
                    <p class="mt-2 text-pink-500 font-bold">Summoning Fairies...</p>
                </div>

                <button id="start-btn" class="bg-gradient-to-r from-pink-400 to-purple-400 hover:from-pink-500 hover:to-purple-500 text-white text-3xl magic-font py-3 px-12 rounded-full transition transform hover:scale-105 shadow-lg">
                    Start Magic
                </button>
            </div>
        </div>

        <!-- Bottom Bar -->
        <div class="flex justify-between items-end w-full">
            <div class="glass-panel p-3 rounded-full flex gap-4 px-6">
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 rounded-full bg-pink-400 shadow-[0_0_10px_pink]"></div>
                    <span class="text-xs font-bold text-pink-700">Left Hand</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 rounded-full bg-teal-400 shadow-[0_0_10px_teal]"></div>
                    <span class="text-xs font-bold text-teal-700">Right Hand</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * MAGICAL AUDIO SYSTEM
         * Soft chimes and twinkles instead of punches
         */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'catch') {
                // High magical ting (Sine wave)
                osc.type = 'sine';
                // Randomize pitch slightly for variety
                const freq = 800 + Math.random() * 400; 
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.1);
                
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.3, now + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 1.5); // Long tail
                
                osc.start(now);
                osc.stop(now + 1.5);

            } else if (type === 'spawn') {
                // Very soft low blip
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(600, now + 0.1);
                
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.05, now + 0.05);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                
                osc.start(now);
                osc.stop(now + 0.3);

            } else if (type === 'quit') {
                // Harp-like strum down
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 1);
                
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 1);
                
                osc.start(now);
                osc.stop(now + 1);
            }
        }

        /**
         * GAME STATE
         */
        const state = {
            isPlaying: false,
            score: 0,
            targets: [], 
            particles: [],
            lastSpawnTime: 0,
            lastUpdateTime: 0,
            spawnInterval: 1500, // Slower, more relaxing pace
            width: 0,
            height: 0
        };

        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const scoreEl = document.getElementById('score-display');
        const menuOverlay = document.getElementById('menu-overlay');
        const startBtn = document.getElementById('start-btn');
        const loadingSpinner = document.getElementById('loading-spinner');
        const comboDisplay = document.getElementById('combo-display');
        const comboText = document.getElementById('combo-text');
        const errorMsg = document.getElementById('error-msg');
        let cameraRunning = false;

        /**
         * BUTTERFLY CLASS (Replaces Target)
         * Positions are normalized (0-1) screen coordinates.
         */
        class Butterfly {
            constructor(x, y, type) {
                this.x = x; 
                this.y = y; 
                this.radius = 0.08; 
                this.type = type; // 'left' (pink) or 'right' (teal)
                this.active = true;
                this.spawnTime = Date.now();
                this.lifetime = 4000; // Live longer
                this.flapSpeed = 0.1 + Math.random() * 0.1;

                // Gentle wandering flight, kept on its own hand's side of the screen
                this.heading = Math.random() * Math.PI * 2;
                this.speed = 0.00003 + Math.random() * 0.00003; // per ms
                this.minX = type === 'left' ? 0.1 : 0.55;
                this.maxX = type === 'left' ? 0.45 : 0.9;
            }

            update(dt) {
                this.heading += (Math.random() - 0.5) * 0.003 * dt;
                this.x += Math.cos(this.heading) * this.speed * dt;
                this.y += Math.sin(this.heading) * this.speed * dt;

                // Turn back at the edges of the flight zone
                if (this.x < this.minX || this.x > this.maxX) {
                    this.heading = Math.PI - this.heading;
                    this.x = Math.min(this.maxX, Math.max(this.minX, this.x));
                }
                if (this.y < 0.15 || this.y > 0.85) {
                    this.heading = -this.heading;
                    this.y = Math.min(0.85, Math.max(0.15, this.y));
                }
            }

            draw(ctx, w, h) {
                if (!this.active) return;
                
                const age = Date.now() - this.spawnTime;
                const remaining = this.lifetime - age;
                const screenX = this.x * w;
                const screenY = this.y * h + Math.sin(age * 0.004) * 6; // Soft bobbing
                // Flapping animation logic
                const flap = Math.sin(age * this.flapSpeed * 0.1); 
                const wingScale = Math.abs(flap); // 0 to 1

                ctx.save();
                // Fade in on arrival, fade out before flying away
                ctx.globalAlpha = Math.max(0, Math.min(1, age / 300, remaining / 800));
                ctx.translate(screenX, screenY);
                const sizeScale = Math.min(w, h) / 720;
                ctx.scale(sizeScale, sizeScale);

                // Set Color
                let colorBase, colorStroke;
                if (this.type === 'left') {
                    colorBase = 'rgba(244, 114, 182, 0.8)'; // Pink-400
                    colorStroke = 'rgba(253, 230, 138, 1)'; // Gold
                } else {
                    colorBase = 'rgba(45, 212, 191, 0.8)'; // Teal-400
                    colorStroke = 'rgba(196, 181, 253, 1)'; // Purple
                }

                // Draw Wings (Left and Right)
                // Use scaleX to flip/flap wings
                ctx.fillStyle = colorBase;
                ctx.strokeStyle = colorStroke;
                ctx.lineWidth = 2;

                // Right Wing (Top)
                ctx.beginPath();
                ctx.ellipse(25 * wingScale, -15, 20 * wingScale, 30, Math.PI / 4, 0, 2 * Math.PI);
                ctx.fill();
                ctx.stroke();

                // Right Wing (Bottom)
                ctx.beginPath();
                ctx.ellipse(20 * wingScale, 15, 15 * wingScale, 20, -Math.PI / 4, 0, 2 * Math.PI);
                ctx.fill();
                ctx.stroke();

                // Left Wing (Top) - mirrored
                ctx.beginPath();
                ctx.ellipse(-25 * wingScale, -15, 20 * wingScale, 30, -Math.PI / 4, 0, 2 * Math.PI);
                ctx.fill();
                ctx.stroke();

                // Left Wing (Bottom) - mirrored
                ctx.beginPath();
                ctx.ellipse(-20 * wingScale, 15, 15 * wingScale, 20, Math.PI / 4, 0, 2 * Math.PI);
                ctx.fill();
                ctx.stroke();

                // Body
                ctx.fillStyle = '#4a4a4a';
                ctx.beginPath();
                ctx.ellipse(0, 0, 5, 20, 0, 0, 2 * Math.PI);
                ctx.fill();

                // Antennae
                ctx.beginPath();
                ctx.moveTo(2, -15);
                ctx.quadraticCurveTo(8, -25, 12, -22);
                ctx.moveTo(-2, -15);
                ctx.quadraticCurveTo(-8, -25, -12, -22);
                ctx.stroke();

                ctx.restore();
            }
        }

        /**
         * STOP FLOWER (Replaces Quit Button)
         * Must be held for a moment so a passing hand doesn't end the game.
         */
        class StopFlower {
            constructor() {
                this.angle = 0;
                this.holdDuration = 1000;
                this.holdStart = null;
            }

            // Pixel position and size; sits in the top-left corner beside the title
            layout(w, h) {
                const r = Math.max(30, Math.min(48, 0.06 * Math.min(w, h)));
                const c = 24 + r * 1.4;
                return { cx: c, cy: c, r };
            }

            isTouching(px, py, w, h) {
                const { cx, cy, r } = this.layout(w, h);
                return Math.hypot(px - cx, py - cy) < r * 1.4;
            }

            // Returns true once the flower has been held long enough
            update(touching, now) {
                if (!touching) {
                    this.holdStart = null;
                    return false;
                }
                if (this.holdStart === null) this.holdStart = now;
                return now - this.holdStart >= this.holdDuration;
            }

            reset() {
                this.holdStart = null;
            }

            draw(ctx, w, h) {
                if (!state.isPlaying) return;

                const { cx, cy, r } = this.layout(w, h);

                this.angle += 0.01;

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(this.angle);

                // Draw Flower Petals
                ctx.fillStyle = '#fca5a5'; // Red-300
                for(let i=0; i<6; i++) {
                    ctx.beginPath();
                    ctx.ellipse(0, -r/1.5, r/3, r/1.5, 0, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.rotate(Math.PI / 3);
                }

                // Center
                ctx.fillStyle = '#fef08a'; // Yellow
                ctx.beginPath();
                ctx.arc(0, 0, r/3, 0, 2*Math.PI);
                ctx.fill();

                ctx.restore();

                // Hold progress ring
                if (this.holdStart !== null) {
                    const progress = Math.min(1, (Date.now() - this.holdStart) / this.holdDuration);
                    ctx.save();
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 6;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.arc(cx, cy, r * 1.45, -Math.PI / 2, -Math.PI / 2 + progress * 2 * Math.PI);
                    ctx.stroke();
                    ctx.restore();
                }

                // Label
                ctx.save();
                ctx.fillStyle = 'white';
                ctx.font = 'bold 14px Quicksand';
                ctx.textAlign = 'center';
                ctx.fillText('HOLD TO STOP', cx, cy + r * 1.4 + 18);
                ctx.restore();
            }
        }
        const stopFlower = new StopFlower();

        /**
         * FAIRY DUST (Replaces Explosion)
         */
        class FairyDust {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 0.01;
                this.vy = -(Math.random() * 0.03 + 0.01); // Float UP
                this.life = 1.0;
                this.size = Math.random() * 0.01 + 0.002;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.02; // Fade slower
                this.vx += (Math.random() - 0.5) * 0.005; // Jitter
            }

            draw(ctx, w, h) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                // Draw star shape or circle
                ctx.arc(this.x * w, this.y * h, this.size * w, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        /**
         * LOGIC
         */
        function spawnButterfly() {
            if (!state.isPlaying) return;
            
            const isLeft = Math.random() > 0.5;
            let x, y;

            if (isLeft) {
                x = 0.15 + (Math.random() * 0.25); 
            } else {
                x = 0.6 + (Math.random() * 0.25);
            }
            // Height variance
            y = 0.2 + (Math.random() * 0.6);

            const type = isLeft ? 'left' : 'right';
            state.targets.push(new Butterfly(x, y, type));
            playSound('spawn');
            
            // Interval gets slightly faster but stays relaxing
            const speedMultiplier = Math.max(800, 1500 - (state.score * 5));
            state.spawnInterval = speedMultiplier;
        }

        function createSparkles(x, y, isLeft) {
            const color = isLeft ? '#f472b6' : '#2dd4bf'; // Pink or Teal
            const gold = '#fde047';
            for(let i=0; i<12; i++) {
                state.particles.push(new FairyDust(x, y, Math.random() > 0.5 ? color : gold));
            }
        }

        let encouragementTimer = null;

        function showEncouragement() {
            const phrases = ["Magical!", "Lovely!", "Sparkle!", "So Gentle!", "Perfect!"];
            const text = phrases[Math.floor(Math.random() * phrases.length)];
            comboText.innerText = text;
            // Restart the animation even if the previous one is still running
            clearTimeout(encouragementTimer);
            comboDisplay.classList.remove('sparkle-anim');
            void comboDisplay.offsetWidth;
            comboDisplay.classList.remove('opacity-0');
            comboDisplay.classList.add('sparkle-anim');
            encouragementTimer = setTimeout(() => {
                comboDisplay.classList.add('opacity-0');
                comboDisplay.classList.remove('sparkle-anim');
            }, 800);
        }

        function stopGame() {
            state.isPlaying = false;
            state.targets = [];
            state.particles = [];
            stopFlower.reset();
            startBtn.innerText = 'Play Again';
            startBtn.classList.remove('hidden');
            menuOverlay.classList.remove('hidden');
            playSound('quit');
        }

        function updateGame() {
            if (!state.isPlaying) return;

            const now = Date.now();
            const dt = Math.min(100, now - state.lastUpdateTime); // Cap jumps after stalls
            state.lastUpdateTime = now;

            if (now - state.lastSpawnTime > state.spawnInterval) {
                spawnButterfly();
                state.lastSpawnTime = now;
            }

            state.targets = state.targets.filter(t => (now - t.spawnTime) < t.lifetime && t.active);
            state.targets.forEach(t => t.update(dt));
            state.particles.forEach(p => p.update());
            state.particles = state.particles.filter(p => p.life > 0);
        }

        // Distances are measured in pixels so hit areas stay round on any screen shape
        function checkCollision(px, py, target, w, h) {
            const dist = Math.hypot(px - target.x * w, py - target.y * h);
            return dist < (target.radius + 0.05) * Math.min(w, h);
        }

        // Where the video is drawn so it fills the screen without stretching (like CSS object-fit: cover)
        function getVideoLayout(image, w, h) {
            const iw = videoElement.videoWidth || image.width;
            const ih = videoElement.videoHeight || image.height;
            const scale = Math.max(w / iw, h / ih);
            const dw = iw * scale;
            const dh = ih * scale;
            return { dx: (w - dw) / 2, dy: (h - dh) / 2, dw, dh };
        }

        function showError(message) {
            loadingSpinner.classList.add('hidden');
            errorMsg.innerText = message;
            errorMsg.classList.remove('hidden');
            startBtn.innerText = 'Try Again';
            startBtn.classList.remove('hidden');
        }

        // MediaPipe setup
        let hands = null;
        if (typeof Hands === 'undefined') {
            showError("The hand-tracking magic couldn't load. Check your internet connection and refresh.");
            startBtn.classList.add('hidden');
        } else {
            hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onResults);
        }

        let camera = null;
        
        function startCamera() {
            startBtn.classList.add('hidden');
            errorMsg.classList.add('hidden');
            loadingSpinner.classList.remove('hidden');

            camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 1280,
                height: 720
            });
            camera.start().catch((err) => {
                console.error(err);
                cameraRunning = false;
                showError("We couldn't open your camera. Please allow camera access and try again.");
            });
        }

        function startGameLogic() {
            loadingSpinner.classList.add('hidden'); 
            menuOverlay.classList.add('hidden');
            state.isPlaying = true;
            state.score = 0;
            scoreEl.innerText = '0';
            state.lastSpawnTime = Date.now();
            state.lastUpdateTime = Date.now();
            state.targets = [];
            state.particles = [];
            stopFlower.reset();
            resizeCanvas();
        }

        function onResults(results) {
            if (!loadingSpinner.classList.contains('hidden') && results.image) {
                startGameLogic();
            }

            const w = canvasElement.width;
            const h = canvasElement.height;
            const video = getVideoLayout(results.image, w, h);

            // Draw the camera mirrored, like a Magic Mirror
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, w, h);
            canvasCtx.translate(w, 0);
            canvasCtx.scale(-1, 1);
            canvasCtx.drawImage(results.image, video.dx, video.dy, video.dw, video.dh);
            canvasCtx.restore();

            updateGame();

            if (state.isPlaying) {
                stopFlower.draw(canvasCtx, w, h);
            }

            let touchingFlower = false;

            if (results.multiHandLandmarks) {
                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    const landmarks = results.multiHandLandmarks[i];
                    const handedness = results.multiHandedness[i]; 
                    // MediaPipe labels hands as if the image were already mirrored.
                    // We send it the raw camera image, so its labels are swapped.
                    const hand = handedness.label === 'Left' ? 'right' : 'left';

                    // Draw Magical Glow Hand Skeleton
                    // drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(255,255,255,0.5)', lineWidth: 1});

                    const pointer = landmarks[8]; // Index finger tip
                    
                    // Convert to mirrored screen pixels to match the drawn video
                    const px = video.dx + (1 - pointer.x) * video.dw;
                    const py = video.dy + pointer.y * video.dh;
                    
                    const glowColor = hand === 'left' ? 'rgba(244, 114, 182, 0.6)' : 'rgba(45, 212, 191, 0.6)';

                    // Outer Glow
                    const gradient = canvasCtx.createRadialGradient(px, py, 5, px, py, 40);
                    gradient.addColorStop(0, 'white');
                    gradient.addColorStop(0.4, glowColor);
                    gradient.addColorStop(1, 'rgba(255,255,255,0)');
                    
                    canvasCtx.fillStyle = gradient;
                    canvasCtx.beginPath();
                    canvasCtx.arc(px, py, 40, 0, 2 * Math.PI);
                    canvasCtx.fill();

                    if (!state.isPlaying) continue;

                    if (stopFlower.isTouching(px, py, w, h)) {
                        touchingFlower = true;
                    }

                    // Collision Check: Butterflies
                    state.targets.forEach(target => {
                        if (target.active && target.type === hand && checkCollision(px, py, target, w, h)) {
                            target.active = false;
                            state.score += 1; // Catching is gentle, 1 point
                            scoreEl.innerText = state.score;
                            playSound('catch');
                            createSparkles(target.x, target.y, target.type === 'left');
                            showEncouragement();
                        }
                    });
                }
            }

            // Collision Check: Stop Flower (held, not just brushed)
            if (state.isPlaying && stopFlower.update(touchingFlower, Date.now())) {
                stopGame();
                return;
            }

            // Draw Butterflies & Dust
            state.targets.forEach(t => t.draw(canvasCtx, w, h));
            state.particles.forEach(p => p.draw(canvasCtx, w, h));
        }

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            state.width = window.innerWidth;
            state.height = window.innerHeight;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        startBtn.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!cameraRunning) {
                startCamera();
                cameraRunning = true;
            } else {
                startGameLogic();
            }
        });

    </script>
</body>
</html>
